<!DOCTYPE html>1
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betriebliche Krankenversicherung</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222;
    }

    /* =========================
       OBERER BEREICH
    ========================= */

    .top-area {
      width: 100%;
      background: white;
      text-align: center;
      padding: 28px 16px 18px;
      border-bottom: 1px solid #e3e3e3;
    }

    .money-icon {
      font-size: 58px;
      margin-bottom: 8px;
    }

    .top-area h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #143b68;
    }

    .top-area p {
      margin: 8px 0 0;
      font-size: 16px;
      color: #666;
    }

    /* =========================
       SPRACHWAHL
    ========================= */

    .language-section {
      background: #f5f7fa;
      padding: 18px 12px;
      border-bottom: 1px solid #ddd;
    }

    .language-buttons {
      width: min(900px, 100%);
      margin: 0 auto;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .language-button {
      appearance: none;
      border: 2px solid #155ea8;
      background: white;
      color: #155ea8;

      padding: 10px 18px;
      border-radius: 999px;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .language-button:hover {
      transform: translateY(-1px);
      background: #eef5fb;
    }

    .language-button.active {
      background: #155ea8;
      color: white;
    }

    /* =========================
       BILD
    ========================= */

    .content {
      width: 100%;
      padding: 20px 10px 40px;
    }

    .image-container {
      width: min(1020px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    #infoImage {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: none;
      padding: 35px 10px;
      text-align: center;
      color: #666;
      font-size: 16px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .top-area {
        padding: 22px 12px 14px;
      }

      .money-icon {
        font-size: 48px;
      }

      .top-area h1 {
        font-size: 23px;
      }

      .top-area p {
        font-size: 15px;
      }

      .language-section {
        padding: 14px 8px;
      }

      .language-buttons {
        gap: 7px;
      }

      .language-button {
        padding: 8px 13px;
        font-size: 14px;
      }

      .content {
        padding: 10px 4px 25px;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       KOPFBEREICH
  ========================== -->

  <section class="top-area">

    <div class="money-icon">
      💸
    </div>

    <h1>
      Betriebliche Krankenversicherung
    </h1>

    <p>
      Sprache auswählen / Select language
    </p>

  </section>


  <!-- =========================
       SPRACHBUTTONS
  ========================== -->

  <section class="language-section">

    <div
      class="language-buttons"
      id="languageButtons"
    ></div>

  </section>


  <!-- =========================
       BILD
  ========================== -->

  <main class="content">

    <div class="image-container">

      <div id="status">
        Wird geladen...
      </div>

      <img
        id="infoImage"
        src="Deutsch.png"
        alt="Betriebliche Krankenversicherung"
      >

    </div>

  </main>


  <script>

    /*
      =============================
      SPRACHEN + DATEINAMEN
      =============================
    */

    const languages = [

      {
        name: "Deutsch",
        file: "Deutsch.png"
      },

      {
        name: "English",
        file: "Englisch.png"
      },

      {
        name: "Italiano",
        file: "Italienisch.png"
      },

      {
        name: "Hrvatski",
        file: "Kroatisch.png"
      },

      {
        name: "Română",
        file: "Rumänisch.png"
      },

      {
        name: "Русский",
        file: "Russisch.png"
      },

      {
        name: "Türkçe",
        file: "Türkisch.png"
      }

    ];


    /*
      =============================
      ELEMENTE
      =============================
    */

    const buttonContainer =
      document.getElementById("languageButtons");

    const image =
      document.getElementById("infoImage");

    const status =
      document.getElementById("status");


    /*
      =============================
      BUTTONS ERSTELLEN
      =============================
    */

    languages.forEach((language, index) => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "language-button";

      button.textContent =
        language.name;


      /*
        Deutsch am Anfang aktiv
      */

      if (index === 0) {
        button.classList.add("active");
      }


      /*
        Klick auf Sprache
      */

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".language-button")
          .forEach(btn => {
            btn.classList.remove("active");
          });

        button.classList.add("active");


        /*
          Ladeanzeige
        */

        image.style.display = "none";

        status.style.display = "block";

        status.textContent =
          "Wird geladen...";


        /*
          Neues Bild laden
        */

        image.src =
          language.file;

        image.alt =
          "Betriebliche Krankenversicherung - " +
          language.name;

      });


      buttonContainer.appendChild(button);

    });


    /*
      =============================
      BILD ERFOLGREICH GELADEN
      =============================
    */

    image.addEventListener("load", () => {

      status.style.display = "none";

      image.style.display = "block";

    });


    /*
      =============================
      BILD NICHT GEFUNDEN
      =============================
    */

    image.addEventListener("error", () => {

      image.style.display = "none";

      status.style.display = "block";

      status.textContent =
        "Das Bild konnte nicht geladen werden.";

    });

  </script>

</body>
</html>
